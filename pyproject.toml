[project]
name="learning_common_lib"
version="0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.121.3",
    "greenlet>=3.2.4",
    "gevent>=25.5.1",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.48",
    "taskiq-redis>=1.1.2",
    "uvicorn>=0.38.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.18",
    "aiohttp>=3.13.2",
    "asyncmy>=0.2.9",
    "celery[redis]>=5.6.2",
    "celery-aio-pool>=0.1.0rc8",
    "redis>=5.0",
    "python-redis-lock>=4.0.0",
    "flower>=2.0.1",
    "langgraph>=1.1.2",
    "langchain>=1.2.12",
    "langchain-openai>=0.3.0",
    "llama-index>=0.14.16",
    "celery-types>=0.26.0",
    "langgraph-checkpoint-redis>=0.4.0",
]
[build-system]
requires = ["hatchling>=1.17.1"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/learning_common_lib"]
